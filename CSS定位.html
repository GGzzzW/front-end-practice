<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位练习</title>

    <style>
        .box{
            height: 300px;
            background-color: rgb(145, 145, 142);
        }
        .box-normal{
            width: 100px;
            height: 100px;
            background-color: rgb(255, 0, 0);
        }
        .box-relative{
            width: 100px;
            height: 100px;
            background-color: rgb(0, 255, 0);
            position: relative;
            left: 50px;
            top: 50px;
        }
        .box1{
            height: 300px;
            background-color: rgb(158, 158, 67);
            margin-bottom: 300px;
        }

        .box-absolute{
            width: 100px;
            height: 100px;
            background-color: rgb(0, 0, 255);
            position: absolute;
            left: 200px;
            top: 600px;
            color: white;
            font-size: 20px;
        }

        .box2{
            width: 100px;
            height: 100px;
            background-color: rgb(255, 0, 255);
            position: fixed;
            right: 0px;
        
            top: 300px;
        }
    </style>
</head>
<body>
    
        <h1>相对定位</h1>
        <div class="box">
            <div class="box-normal"></div>
            <div class="box-relative">相对定位</div>
            <div class="box-normal"></div>
        </div>
        <h1>绝对定位</h1>
        <div class="box1" margin-bottom="100px">
            <div class="box-normal"></div>
            <div class="box-absolute">绝对定位</div>
            <div class="box-normal"></div>   
        </div>

        <h1>固定定位</h1>
        <div class="box2">固定定位</div>
</body>
</html>
