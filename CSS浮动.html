<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS浮动练习</title>
    <style>
        .father {
            background-color: yellow;
            height: 200px;
            border: 5px solid black;
        }

        .left-son {
            width: 100px;
            height: 100px;
            float: left;
            background-color: red;
            color: rgb(47, 11, 229);
        }

        .right-son {
            width: 100px;
            height: 100px;
            float: right;
            background-color: blue; 
        }
    </style>

</head>
<body>
    <div class="father">
        <div class="left-son">左浮动子元素</div>
        <div class="right-son" style="color:white;">右浮动子元素</div>
    </div>
</body>
</html>
