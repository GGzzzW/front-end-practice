<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS选择器</title>

    <style>

/* 元素选择器 */
        h2 {
            color:coral;
            
        }
/* 类选择器 */
        .hightlight {
            background-color: rgb(5, 125, 165);
        }

/* ID选择器 */
        #unique {
            color: rgba(142, 91, 238, 0.329);
            fsont-size: large;
        }

        /* 下面是通用选择器 */
        *{
            font-family:'kaiti';
        }
        /* 子元素选择器 */
        .father>.son{
            color: rgb(27, 238, 72);
            front-family: 'fangsong';
            font-size: larger;
        }

        /* 后代选择器 */
        .father p{
            color: rgb(238, 27, 27);
            font-family: 'fangsong';
            font-size: larger;
        }

    </style>

</head>
<body>

<h1>不同CSS选择器</h1>    
<h2>CSS选择器:元素选择器</h2>
<h3 class="hightlight">CSS选择器:类选择器</h3>
<h3>另一个h3标签</h3>

<h4 id="unique">CSS选择器:ID选择器</h4>

<div class="father">
    <p class="son">子元素选择器</p>
    <div>
        <p class="grandson">后代选择器</p>
    </div>
</div>

</body>
</html>
