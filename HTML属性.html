<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML属性练习</title>
</head>
<body>
<a href="http://www.baidu.com">这是一个超链接</a>
br标签是换行标签，br是单标签，没有闭合标签
<br>
hr标签是水平线标签，hr是单标签，没有闭合标签
<hr>
<a href="http://www.baidu.com" target="_blank">这是另一个一个百度超链接，targe是定义链接打开方式的</a>

img标签是图片标签，img是单标签，没有闭合标签，src是定义图片路径的属性，alt是定义图片无法显示时的替代文本的属性
<img src="https://www.baidu.com/img/bd_logo1.png" alt="百度logo">
<hr>
<img src="meiyou.png" alt="图片无法显示">   
</body>
</html>
