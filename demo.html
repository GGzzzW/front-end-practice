<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 练习</title>
</head>
<body>  
<h1>一级标题标签</h1>
<h2>二级标题标签</h2>
<h3>三级标题标签</h3>
<h4>四级标题标签</h4>
<h5>五级标题标签</h5>
<p>这是一个段落标签</p>
<p>文本样式更改： <b>加粗</b> <strong>也是加粗</strong> <i>斜体</i> <u>下划线</u> <s>删除线</s> 
</p>

<p>列表</p>
<ul>
    <li>无序列表项1</li>
    <li>列表项2</li>
    <li>列表项3</li>
</ul>

<ol>
    <li>有序列表项1</li>
    <li>有序列表项2</li>
    <li>有序列表项3</li>
</ol>

<table border="1">
    <tr>
        <th>列标签1</th>
        <th>列标签2</th>
        <th>列标签3</th>
    </tr>
    <tr>
        <td>单元格1</td>
        <td>单元格2</td>
        <td>单元格3</td>
    </tr>
    <tr>
        <td>单元格4</td>
        <td>单元格5</td>
        <td>单元格6</td>
    </tr>
    <tr>
        <td>单元格7</td>
        <td>单元格8</td>
        <td>单元格9</td>
    </tr>
</table>

</body>
</html>
